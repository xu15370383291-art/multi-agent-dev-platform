name: agent-company
services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: company
      POSTGRES_USER: company
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-company_local}
    ports:
      - "127.0.0.1:55432:5432"
    volumes:
      - company_db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U company -d company"]
      interval: 3s
      timeout: 3s
      retries: 20
volumes:
  company_db:
